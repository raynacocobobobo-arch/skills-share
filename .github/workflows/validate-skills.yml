name: Validate Hermes skills

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run validator regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Reject manual registry edits
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" -- \
            manifests/skill-registry.json | grep -q .; then
            echo "::error::manifests/skill-registry.json is generated automatically. Edit SKILL.md metadata instead."
            exit 1
          fi

      - name: Capture accepted PR base registry
        if: github.event_name == 'pull_request'
        run: |
          git show "${{ github.event.pull_request.base.sha }}:manifests/skill-registry.json" > /tmp/baseline-registry.json

      - name: Capture accepted pre-push registry
        if: github.event_name == 'push'
        run: |
          BEFORE_SHA=$(python3 -c 'import json, os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))["before"])')
          if [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git show "$BEFORE_SHA:manifests/skill-registry.json" > /tmp/baseline-registry.json
          fi

      - name: Validate skills and generate canonical registry
        run: |
          if [ -f /tmp/baseline-registry.json ]; then
            python3 scripts/validate-skills.py \
              --baseline-registry /tmp/baseline-registry.json \
              --write-registry
          else
            python3 scripts/validate-skills.py --write-registry
          fi

      - name: Upload generated registry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-skill-registry
          path: manifests/skill-registry.json

  sync-registry:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Regenerate registry
        run: python3 scripts/validate-skills.py --write-registry

      - name: Commit registry when changed
        run: |
          if git diff --quiet -- manifests/skill-registry.json; then
            echo "Registry already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests/skill-registry.json
          git commit -m "chore: sync generated skill registry"
          git push origin HEAD:main
