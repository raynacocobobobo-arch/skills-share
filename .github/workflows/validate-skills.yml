name: Validate Hermes skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run validator regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Capture accepted base registry
        if: github.event_name == 'pull_request'
        run: |
          git show "${{ github.event.pull_request.base.sha }}:manifests/skill-registry.json" > /tmp/baseline-registry.json

      - name: Validate skills and regenerate registry
        run: |
          if [ -f /tmp/baseline-registry.json ]; then
            python3 scripts/validate-skills.py \
              --baseline-registry /tmp/baseline-registry.json \
              --write-registry
          else
            python3 scripts/validate-skills.py --write-registry
          fi

      - name: Upload generated registry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-skill-registry
          path: manifests/skill-registry.json

      - name: Require committed registry to match generated registry
        run: git diff --exit-code -- manifests/skill-registry.json
