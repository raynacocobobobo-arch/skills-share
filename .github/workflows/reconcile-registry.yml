name: Reconcile generated registry

on:
  push:
    branches:
      - maintenance/main-reconcile

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: maintenance/main-reconcile
          fetch-depth: 0

      - name: Run regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Regenerate registry from canonical tree
        run: python3 scripts/validate-skills.py --baseline-registry manifests/skill-registry.json --write-registry

      - name: Commit generated registry when changed
        run: |
          if git diff --quiet -- manifests/skill-registry.json; then
            echo "Registry already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests/skill-registry.json
          git commit -m "chore: regenerate canonical skill registry"
          git push origin HEAD:maintenance/main-reconcile
