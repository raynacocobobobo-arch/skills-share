              ),
          }

          for name, (anchor, replacement) in edits.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if replacement in text:
                  continue
              count = text.count(anchor)
              if count != 1:
                  raise SystemExit(f"{name}: expected anchor exactly once, got {count}")
              path.write_text(text.replace(anchor, replacement, 1), encoding="utf-8")
          PY

      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/tmp-creative-reference-routing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/hermes-skills/skills .github/workflows/tmp-creative-reference-routing.yml
          git commit -m "fix: connect skills to canonical creative references"
          git push origin HEAD:feature/creative-reference-routing-canonical
