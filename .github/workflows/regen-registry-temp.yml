name: Temporary regenerate skill registry

on:
  push:
    branches:
      - fix/digital-human-identity-drift-v1.1.0

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run validator tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Regenerate registry
        run: python3 scripts/validate-skills.py --write-registry

      - name: Verify generated registry
        run: python3 scripts/validate-skills.py --check-registry manifests/skill-registry.json

      - name: Commit registry if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests/skill-registry.json
          if git diff --cached --quiet; then
            echo "Registry already current"
          else
            git commit -m "chore(registry): regenerate skill metadata"
            git push
          fi
