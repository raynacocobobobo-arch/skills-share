# Hermes Knowledge Scout Watchlist
# Focus: reusable workflows, not tool advertisements.
#
# 分层（tier）：
#   daily    —— 每日研究：AI能力/工作流变化、新方法
#   weekly   —— 每周观察：生态趋势、应用案例
#   knowledge—— 长期知识：基础原理、认知，不进入 Daily Research
#   observe  —— 低频观察：导演/视觉/创意视角
#
# 过滤原则（人工选频道时遵循，不抓）：
#   - AI 新闻搬运
#   - Top 10 AI Tools / 工具合集
#   - 标题党内容
# 优先：workflow / tutorial / how I use AI / case study / build / create / complete process

